      +'<label class="no" id="n'+b.n+'"><input type="radio" name="c'+b.n+'" value="0" onchange="pick('+b.n+',0)">동의안함</label></div></div>';
  });
  h+='<div class="fld"><label for="nm">성명</label><input id="nm" type="text" placeholder="이름을 적어 주세요" autocomplete="name"></div>';
  h+='<div class="fld"><label for="ph">휴대폰 번호 <span style="font-weight:400;color:#64748b">(같은 이름이 있을 때 구분용 · 안 적으셔도 됩니다)</span></label>'
    +'<input id="ph" type="tel" inputmode="numeric" placeholder="예) 01012345678"></div>';
  h+='<div class="fld"><label>서명</label><canvas id="cv" class="sign"></canvas>'
    +'<div class="row"><button type="button" onclick="clearSign()">지우고 다시</button></div></div>';
  h+='<div class="foot">'+esc(dayKr(DAY))+'<br>본인 성명 <b id="pv" style="color:#0f172a">　　　　</b> (서명)</div>';
  h+='<div class="note">'+esc(C.note)+'</div>';
  h+='<div class="note" style="text-align:center;font-weight:700;color:#0f172a">'+esc(C.foot)+'</div>';
  return h+'</div>';
}
function pick(n,v){
  PICK[n]=v;
  var y=$('y'+n),no=$('n'+n);
  if(y)y.classList.toggle('on',v===1);
  if(no)no.classList.toggle('on',v===0);
}
function initSign(){
  CV=$('cv'); if(!CV)return;
  var r=CV.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  CV.width=r.width*dpr; CV.height=r.height*dpr;
  CTX=CV.getContext('2d'); CTX.scale(dpr,dpr);
  CTX.lineWidth=3; CTX.lineCap='round'; CTX.lineJoin='round'; CTX.strokeStyle='#0f172a';
  var draw=false,px=0,py=0;
  function pos(e){var r=CV.getBoundingClientRect(),t=(e.touches&&e.touches[0])||e;return[t.clientX-r.left,t.clientY-r.top]}
  function down(e){e.preventDefault();draw=true;var p=pos(e);px=p[0];py=p[1]}
  function move(e){if(!draw)return;e.preventDefault();var p=pos(e);CTX.beginPath();CTX.moveTo(px,py);CTX.lineTo(p[0],p[1]);CTX.stroke();px=p[0];py=p[1];DIRTY=true}
  function up(){draw=false}
  CV.addEventListener('mousedown',down);CV.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
  CV.addEventListener('touchstart',down,{passive:false});CV.addEventListener('touchmove',move,{passive:false});
  CV.addEventListener('touchend',up);
}
function clearSign(){ if(CTX&&CV){CTX.clearRect(0,0,CV.width,CV.height);DIRTY=false;} }
function goConsent(){
  $('p1').classList.add('hid');$('b1').classList.add('hid');
  $('p2').innerHTML=consentHtml();$('p2').classList.remove('hid');$('b2').classList.remove('hid');
  window.scrollTo(0,0);
  setTimeout(initSign,30);
  var nm=$('nm'); if(nm) nm.oninput=function(){ var p=$('pv'); if(p) p.textContent=nm.value||'　　　　'; };
}
function goOri(){
  $('p2').classList.add('hid');$('b2').classList.add('hid');
  $('p1').classList.remove('hid');$('b1').classList.remove('hid');window.scrollTo(0,0);
}
function save(){
  var need=DOC.consent.blocks.map(function(b){return b.n}).filter(function(n){return PICK[n]===undefined});
  if(need.length){ alert('아직 고르지 않으신 항목이 있습니다.\n'+need.join('번, ')+'번 항목에서 «동의함» 또는 «동의안함»을 눌러 주세요.'); return; }
  var nm=String(($('nm')||{}).value||'').trim();
  if(!nm){ alert('성명을 적어 주세요.'); var e=$('nm'); if(e)e.focus(); return; }
  if(!DIRTY){ alert('서명을 해주세요.'); return; }
  var ph=String(($('ph')||{}).value||'').replace(/[^0-9]/g,'');
  var sign=CV.toDataURL('image/png');
  if(!DB){ alert('인터넷 연결이 필요합니다. 잠시 뒤 다시 눌러 주세요.'); return; }
  var id=DAY.replace(/-/g,'')+'_'+nm+(ph?('_'+ph.slice(-4)):'')+'_'+Math.random().toString(36).slice(2,6);
  var rec={교육일:DAY,성명:nm,휴대폰:ph,서명:sign,
    동의:{수집이용:PICK[1]===1,고유식별:PICK[2]===1,제3자제공:PICK[3]===1},
    전체동의:(PICK[1]===1&&PICK[2]===1&&PICK[3]===1),
    ts:new Date().toISOString()};
  var btn=document.querySelector('#b2 .btn'); if(btn){btn.disabled=true;btn.textContent='보내는 중…';}
  DB.collection(COL).doc(id.replace(/[\/\.\#\$\[\]]/g,'_')).set(rec).then(function(){
    $('p2').classList.add('hid');$('b2').classList.add('hid');
    $('okwho').textContent=dayKr(DAY)+' · '+nm+' 선생님';
    $('p3').classList.remove('hid');window.scrollTo(0,0);
  }).catch(function(e){
    if(btn){btn.disabled=false;btn.textContent='동의하고 제출하기';}
    alert('제출하지 못했습니다.\n'+(e.message||e)+'\n\n다시 눌러 주시고, 계속 안 되면 선생님께 말씀해 주세요.');
  });
}

/* ── 관리자 (주소 끝에 ?admin=1) ── */
var ROWS=[];
function admin(){
  ['p1','b1','p2','b2','p3'].forEach(function(i){var e=$(i);if(e)e.classList.add('hid')});
  $('p4').classList.remove('hid');
  $('tt').textContent='보수교육 동의서 — 관리자';
  $('ts').textContent='교육일별 제출 현황';
  render('<div class="tools noprint"><input id="dd" type="date" value="'+DAY+'"><button class="p" onclick="load()">불러오기</button></div><div id="tb"></div>');
  load();
}
function render(h){ $('p4').innerHTML=h; }
function load(){
  var d=($('dd')||{}).value||DAY;
  var box=$('tb'); if(box) box.innerHTML='<p style="padding:20px;text-align:center;color:#64748b">불러오는 중…</p>';
  if(!DB){ if(box)box.innerHTML='<p style="padding:20px">인터넷 연결이 필요합니다.</p>'; return; }
  DB.collection(COL).where('교육일','==',d).get().then(function(qs){
    ROWS=[]; qs.forEach(function(s){ ROWS.push(s.data()); });
    ROWS.sort(function(a,b){ return String(a.성명).localeCompare(String(b.성명),'ko'); });
    draw(d);
  }).catch(function(e){ if(box)box.innerHTML='<p style="padding:20px">불러오지 못했습니다 · '+esc(e.message||e)+'</p>'; });
}
function draw(d){
  var h='<div class="tools noprint"><b style="align-self:center">'+dayKr(d)+' · '+ROWS.length+'명</b>'
    +'<button class="p" onclick="window.print()">🖨 명단 인쇄</button>'
    +'<button onclick="sheets()">🖨 1인 1장 동의서</button></div>';
  if(!ROWS.length){ $('tb').innerHTML=h+'<p style="padding:24px;text-align:center;color:#64748b">아직 제출된 동의서가 없습니다.</p>'; return; }
  h+='<div style="font-weight:800;margin:6px 0 8px">요양보호사 보수교육 개인정보 동의서 — '+dayKr(d)+' (가나다순)</div>';
  h+='<table><tr><th style="width:7%">번호</th><th style="width:18%">성명</th><th style="width:20%">휴대폰</th>'
    +'<th style="width:9%">수집<br>이용</th><th style="width:9%">고유<br>식별</th><th style="width:9%">제3자<br>제공</th><th>서명</th></tr>';
  ROWS.forEach(function(r,i){
    function m(v){return v?'<span style="color:#065f46;font-weight:800">동의</span>':'<span style="color:#b91c1c;font-weight:800">거부</span>'}
    var c=r.동의||{};
    h+='<tr><td>'+(i+1)+'</td><td><b>'+esc(r.성명)+'</b></td><td>'+esc(r.휴대폰||'')+'</td>'
      +'<td>'+m(c.수집이용)+'</td><td>'+m(c.고유식별)+'</td><td>'+m(c.제3자제공)+'</td>'
      +'<td>'+(r.서명?'<img src="'+r.서명+'" alt="서명">':'')+'</td></tr>';
  });
  $('tb').innerHTML=h+'</table>';
}
function sheets(){
  var C=DOC.consent,h='';
  ROWS.forEach(function(r){
    var c=r.동의||{},mark=function(v){return v?['■','□']:['□','■']};
    h+='<div class="sheet"><h2 style="text-align:center;font-size:17pt;line-height:1.5;margin-bottom:10px">'+esc(C.title)+'</h2>'
      +'<p style="font-size:10.5pt;margin-bottom:10px">'+esc(C.intro)+'</p>';
    C.blocks.forEach(function(b){
      var mk=mark(b.n===1?c.수집이용:(b.n===2?c.고유식별:c.제3자제공));
      h+='<div style="border:1px solid #333;padding:9px;margin:8px 0;font-size:10.5pt">'
        +'<b>'+b.n+'. '+esc(b.h)+'</b>';
      b.rows.forEach(function(x){ h+='<div style="margin:3px 0">· '+esc(x[0])+' : '+esc(x[1])+'</div>'; });
      h+='<div style="margin-top:6px;font-size:9.5pt;color:#444">※ '+esc(b.warn)+'</div>'
        +'<div style="margin-top:7px;font-weight:700">☞ '+esc(b.q)+'　　동의함 '+mk[0]+'　　동의안함 '+mk[1]+'</div></div>';
    });
    h+='<div style="text-align:center;margin-top:16px;font-size:11pt;line-height:2.2">'+esc(dayKr(r.교육일))
      +'<br>본인 성명 <b style="font-size:13pt">'+esc(r.성명)+'</b> '
      +(r.서명?'<img src="'+r.서명+'" style="height:52px;vertical-align:middle">':'(서명 또는 인)')
      +'<br><b>'+esc(C.foot)+'</b></div></div>';
  });
  var w=window.open('','_blank');
  if(!w){ alert('팝업이 막혀 있습니다. 브라우저에서 팝업을 허용해 주세요.'); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><title>보수교육 동의서</title>'
    +'<style>body{font-family:"Malgun Gothic",sans-serif;margin:14mm}'
    +'.sheet{page-break-after:always}</style>'+h);
  w.document.close(); setTimeout(function(){ w.print(); },400);
}
if(qs('admin')==='1') admin();
</script>
</body></html>
